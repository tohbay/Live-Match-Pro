<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="faviconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#faviconBg)" />
  <rect x="5" y="5" width="54" height="54" rx="15" fill="#0F172A" />

  <!-- Golden Football Trophy -->
  <path d="M 22,18 L 42,18 L 40,32 Q 38,40 32,42 Q 26,40 24,32 Z" fill="#F59E0B" />
  <path d="M 32,42 L 32,50 L 26,52 L 38,52 L 32,50 Z" fill="#F59E0B" />
  <!-- Trophy Base -->
  <rect x="24" y="51" width="16" height="4" rx="1" fill="#D97706" />

  <!-- Trophy Handles -->
  <path d="M 22,22 C 16,22 16,32 24,32" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 42,22 C 48,22 48,32 40,32" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />

  <!-- Mini Football Ball in Center -->
  <circle cx="32" cy="26" r="4.5" fill="#FFFFFF" />
  <path d="M 30,26 L 32,24 L 34,26 L 33,28 L 31,28 Z" fill="#0F172A" />
</svg>
