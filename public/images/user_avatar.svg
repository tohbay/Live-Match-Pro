<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D0A9" />
      <stop offset="100%" stop-color="#E8B48A" />
    </linearGradient>
    <linearGradient id="jacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#331D0D" />
      <stop offset="100%" stop-color="#1F1106" />
    </linearGradient>
  </defs>

  <!-- Circular Avatar Background -->
  <circle cx="60" cy="60" r="58" fill="url(#avatarBg)" stroke="#06B6D4" stroke-width="3"/>
  <circle cx="60" cy="60" r="54" fill="#0F172A"/>

  <!-- Shoulders & Fan Jacket -->
  <path d="M 18,110 C 20,82 40,75 60,75 C 80,75 100,82 102,110 Z" fill="url(#jacket)" stroke="#334155" stroke-width="2"/>
  <!-- Collar Accent -->
  <path d="M 45,77 L 60,92 L 75,77 L 60,82 Z" fill="#06B6D4"/>

  <!-- Neck -->
  <rect x="52" y="60" width="16" height="20" rx="4" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="60" cy="50" rx="20" ry="24" fill="url(#skin)"/>

  <!-- Ears -->
  <circle cx="39" cy="52" r="4.5" fill="url(#skin)"/>
  <circle cx="81" cy="52" r="4.5" fill="url(#skin)"/>

  <!-- Hair -->
  <path d="M 38,48 C 38,28 50,22 60,22 C 72,22 82,28 82,48 C 76,36 68,34 60,34 C 50,34 44,38 38,48 Z" fill="url(#hair)"/>

  <!-- Eyes -->
  <ellipse cx="51" cy="48" rx="2.5" ry="3" fill="#1E293B"/>
  <ellipse cx="69" cy="48" rx="2.5" ry="3" fill="#1E293B"/>
  <!-- Eye Reflections -->
  <circle cx="50" cy="47" r="0.8" fill="#FFFFFF"/>
  <circle cx="68" cy="47" r="0.8" fill="#FFFFFF"/>

  <!-- Eyebrows -->
  <path d="M 46,42 Q 51,40 56,43" fill="none" stroke="url(#hair)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 64,43 Q 69,40 74,42" fill="none" stroke="url(#hair)" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 60,48 Q 58,54 61,56" fill="none" stroke="#D49A6A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Smiling Mouth -->
  <path d="M 52,60 Q 60,67 68,60" fill="none" stroke="#C07646" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 54,61 Q 60,65 66,61" fill="#FFFFFF"/>

</svg>
