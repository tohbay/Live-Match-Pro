<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer Red Ring -->
  <circle cx="50" cy="50" r="48" fill="#DC052D" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Inner White Ring -->
  <circle cx="50" cy="50" r="36" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="32" fill="#0066B2"/>
  <!-- Text FC BAYERN MÜNCHEN -->
  <path id="bayernArc" d="M 18,50 A 32,32 0 1,1 82,50" fill="none"/>
  <text font-family="Arial, sans-serif" font-weight="900" font-size="5.5" fill="#FFFFFF" text-anchor="middle">
    <textPath href="#bayernArc" startOffset="50%">FC BAYERN MÜNCHEN</textPath>
  </text>
  <!-- Center Bavarian Diamond Pattern -->
  <g transform="translate(50,50) rotate(45) scale(0.45)">
    <rect x="-30" y="-30" width="60" height="60" fill="#FFFFFF"/>
    <path d="M -30,-10 L -10,-30 L 10,-30 L -30,10 Z M 10,-30 L 30,-30 L -30,30 L -30,10 Z M 30,-10 L -10,30 L 10,30 L 30,-10 Z" fill="#0066B2"/>
  </g>
</svg>
